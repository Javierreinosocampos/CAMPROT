<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso interno — CAMPROT</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<script>
  // Set the theme before first paint to avoid a light/dark flash.
  (function(){
    var saved = localStorage.getItem("camprot-theme");
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
  })();
</script>
</head>
<body>

  <div class="theme-corner">
    <button class="icon-btn" id="themeToggle" aria-label="Cambiar tema"></button>
  </div>

  <div class="login-shell">
    <div class="login-card" id="loginCard">
      <img src="assets/logo-mark.png" alt="Camprot">
      <h1>CAMPROT</h1>
      <p class="tag">Acceso interno</p>

      <form id="accessForm">
        <label>Código de acceso
          <input type="password" id="accessCode" autocomplete="off" placeholder="••••••••" required>
        </label>
        <button type="submit" class="btn">Entrar</button>
      </form>

      <p class="login-msg" id="loginMsg"></p>
      <p class="login-hint"><a href="../index.html">← Volver al inicio</a></p>
    </div>
  </div>

<script type="module">
  import { initTheme, hasAccess, grantAccess } from "./assets/app.js";

  initTheme();
  if (hasAccess()) window.location.href = "comparar.html";

  const form = document.getElementById("accessForm");
  const card = document.getElementById("loginCard");
  const msg = document.getElementById("loginMsg");
  const input = document.getElementById("accessCode");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const code = input.value.trim();

    if (grantAccess(code)) {
      window.location.href = "comparar.html";
      return;
    }

    msg.textContent = "Código incorrecto. Inténtalo de nuevo.";
    card.classList.remove("shake");
    void card.offsetWidth; // reflow to restart the animation
    card.classList.add("shake");
    input.select();
  });
</script>
</body>
</html>
