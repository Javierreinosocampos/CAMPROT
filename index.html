<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAMPROT — Protect the Origin</title>
<link rel="icon" href="interno/assets/logo-mark.png">
<link rel="stylesheet" href="styles.css">
<script>
  // Set the theme before first paint to avoid a light/dark flash.
  (function(){
    var saved = localStorage.getItem("camprot-theme");
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", saved || (dark ? "dark" : "light"));
  })();
</script>
</head>
<body>

  <div class="theme-corner">
    <button class="icon-btn" id="themeToggle" aria-label="Cambiar tema"></button>
  </div>

  <main class="hero">
    <img class="hero-mark" src="interno/assets/logo-mark.png" alt="">
    <p class="hero-eyebrow">Bienvenido a</p>
    <h1>CAMPROT</h1>
    <p class="hero-tagline">Protect the origin</p>

    <div class="hero-actions">
      <a class="gate-btn primary" href="presentation/index.html">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H4z"/><path d="M8 20h8M12 16v4"/></svg>
        </span>
        <span class="label">Presentación</span>
        <span class="desc">Conoce el proyecto</span>
      </a>

      <a class="gate-btn" href="interno/index.html">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </span>
        <span class="label">Interno</span>
        <span class="desc">Acceso al equipo</span>
      </a>
    </div>

    <p class="hero-footer">CAMPROT</p>
  </main>

<script src="scripts.js"></script>
</body>
</html>
